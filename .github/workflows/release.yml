# Build the app image on every platform and attach the installers to a GitHub release.
#
# Triggered by a version tag. The pom's version is the single source of truth: the tag has to agree
# with it, and the preflight fails in seconds if it does not — artifacts labelled with a version
# they were not built from are worse than no artifacts. docs/release.md is the checklist.
#
# Three targets, not five: the engine's native library exists for Linux x86_64, macOS arm64 and
# Windows x86_64 only, and -Pdist fails at the unpack step on any other platform.
#
# The hardening is Editora's, which met each of these first: version-shaped tags only, a read-only
# token everywhere but the job that publishes, actions and JReleaser pinned, CI required on the
# tagged commit, and a dry run that runs JReleaser rather than stopping before it.
name: Release

on:
  push:
    # Version-shaped tags only (vX.Y.Z, optionally with a suffix such as -rc1). A bare `v*` also
    # fires on a tag like `v-test`, and everything downstream assumes the tag is a version.
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  # A dry run: builds and uploads every installer, then runs JReleaser with --dry-run, which
  # renders the notes, the cask and the winget manifests and publishes nothing.
  workflow_dispatch:

# Read-only by default. Only the job that publishes asks for more, in its own block: the build legs
# run third-party actions and the platforms' packaging tools, and must not hold a token that can
# write to the repository. Actions are pinned to a commit with the version in a trailing comment
# (Dependabot moves both, .github/dependabot.yml): a tag is mutable, a SHA is not.
permissions:
  contents: read

jobs:
  preflight:
    name: Preflight (version, changelog, CI)
    runs-on: ubuntu-latest
    # Waits up to an hour for CI on the tagged commit (macOS and Windows runners can queue).
    timeout-minutes: 75
    permissions:
      contents: read
      # Read CI's runs on the commit, and start one when there is none.
      actions: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          pom=$(./mvnw -B -q --no-transfer-progress help:evaluate -Dexpression=project.version -DforceStdout)
          public="${pom%-SNAPSHOT}"
          # A dry run from a -SNAPSHOT pom is validated as the plain version: JReleaser refuses a
          # snapshot for an immutable release even with --dry-run (Editora found it). The installers
          # still carry the build's own identity.
          echo "version=$public" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$public" ]; then
              echo "::error::tag v$tag does not match the pom version $pom"
              echo "::error::Set <version> in pom.xml to $tag (without -SNAPSHOT) and re-tag."
              exit 1
            fi
            if [ "$pom" != "$public" ]; then
              echo "::error::refusing to release a snapshot ($pom); drop -SNAPSHOT from pom.xml"
              exit 1
            fi
          fi
          echo "Releasing $public (pom $pom)"

      # The release body: the install text and this version's CHANGELOG.md section. A tag whose
      # changelog still says "Unreleased" stops here; a dry run takes "Unreleased" as it is.
      - name: Write the release notes
        shell: bash
        run: |
          set -euo pipefail
          java scripts/release/ReleaseNotesTest.java
          unreleased=""
          [ "$GITHUB_REF_TYPE" = "tag" ] || unreleased="--unreleased"
          java scripts/release/ReleaseNotes.java $unreleased "${{ steps.version.outputs.version }}" \
            CHANGELOG.md .github/release-notes.md out/release-notes.md
          cat out/release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: out/release-notes.md
          retention-days: 14
          if-no-files-found: error

      # The build legs run no tests and a tag can be pushed on any commit, so this is what keeps a
      # release from being cut from code CI never passed. The newest CI run on the commit decides:
      # success passes, a failure stops the release at once, and none at all (or one cancelled,
      # which a newer push to master does to the older commit's run) starts CI on the tag and waits
      # for it. A dry run only reports. A failure unrelated to the code: re-run CI on the commit,
      # then re-run this workflow.
      - name: Require CI on this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          enforce=false
          [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "tag" ] && enforce=true
          newest() {
            gh run list --workflow ci.yml --commit "$GITHUB_SHA" --limit 20 \
              --json databaseId,status,conclusion,createdAt \
              --jq 'sort_by(.createdAt) | last | if . == null then "" else "\(.databaseId) \(.status) \(.conclusion)" end'
          }
          dispatched=false
          deadline=$((SECONDS + 60 * 60))
          while :; do
            read -r id status conclusion <<< "$(newest)" || true
            if [ -n "${id:-}" ] && [ "$status" = "completed" ]; then
              case "$conclusion" in
                success)
                  echo "CI passed on $GITHUB_SHA (run $id)."; exit 0 ;;
                cancelled|skipped|stale) ;;
                *)
                  level=warning; $enforce && level=error
                  echo "::$level::CI ended '$conclusion' on $GITHUB_SHA: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id"
                  $enforce && exit 1 || exit 0 ;;
              esac
            elif [ -n "${id:-}" ]; then
              $enforce || { echo "::notice::CI is still running on $GITHUB_SHA (run $id)."; exit 0; }
              echo "CI is $status on $GITHUB_SHA (run $id); waiting."
            fi
            if [ -z "${id:-}" ] || [ "$status" = "completed" ]; then
              if ! $enforce; then
                echo "::warning::No finished CI run on $GITHUB_SHA. A tag would start one and wait for it."
                exit 0
              fi
              if ! $dispatched; then
                echo "No usable CI run on $GITHUB_SHA; starting one on $GITHUB_REF_NAME."
                gh workflow run ci.yml --ref "$GITHUB_REF_NAME"
                dispatched=true
              fi
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::CI did not finish on $GITHUB_SHA within an hour."
              exit 1
            fi
            sleep 30
          done

  build:
    name: ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: macos-arm64
          - os: windows-latest
            target: windows-x64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # jpackage shells out to each platform's own packaging tools, and none of them are a given on
      # a fresh runner.
      - name: Installer prerequisites
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Linux)
              # dpkg-deb is present; rpmbuild is not, and jpackage fails the rpm without it.
              sudo apt-get update -qq
              sudo apt-get install -y -qq fakeroot rpm binutils
              ;;
            Windows)
              # jpackage builds an MSI through WiX and cannot make one without it.
              choco install wixtoolset --no-progress -y
              echo "C:\\Program Files (x86)\\WiX Toolset v3.14\\bin" >> "$GITHUB_PATH"
              ;;
          esac

      # macOS Developer ID signing: the .p12 (certificate + key + Apple's Developer ID G2 intermediate)
      # goes into a throw-away keychain, and the identity it holds is handed to the Package step, where
      # scripts/sign-mac-app.sh signs the finished app and build-installers.sh its dmg. "Notarize the dmg"
      # below has Apple notarize it and staples the ticket. The secrets: docs/release.md.
      #
      # On a tag, missing secrets fail the leg: an unsigned dmg is what this exists to stop shipping, and a
      # published release is immutable. A manual dry run without them builds ad-hoc signed and says so.
      - name: Import signing certificate (macOS)
        id: macsign
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$MACOS_CERT_P12" ] || [ -z "$MACOS_CERT_PASSWORD" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "::error title=macOS signing secrets missing::MACOS_CERT_P12 / MACOS_CERT_PASSWORD are not set; refusing to release an unsigned dmg"
              exit 1
            fi
            echo "::warning title=macOS build unsigned::no signing secrets, so this dry run's dmg is ad-hoc signed and not notarized"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          kc="$RUNNER_TEMP/torrenta-signing.keychain-db"
          kcpass="$(uuidgen)"
          security create-keychain -p "$kcpass" "$kc"
          # No auto-lock during the build (the default locks after 5 minutes of inactivity).
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          p12="$RUNNER_TEMP/torrenta-signing.p12"
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$p12"
          if ! security import "$p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign; then
            rm -f "$p12"
            echo "::error title=Certificate import failed::macOS could not open MACOS_CERT_P12 with MACOS_CERT_PASSWORD. Usually the password secret does not match the .p12 (re-set it at the gh prompt; a piped echo adds a newline); otherwise the .p12 was exported without openssl's -legacy"
            exit 1
          fi
          rm -f "$p12"
          # Lets codesign use the key without the GUI prompt a runner can never answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpass" "$kc" > /dev/null
          # Add it to the search list next to the login keychain, which codesign needs to build the chain.
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$kc" | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$identity" ]; then
            security find-identity -v -p codesigning "$kc"
            echo "::error title=No Developer ID identity::the imported .p12 holds no valid Developer ID Application identity"
            exit 1
          fi
          echo "Signing as: $identity"
          {
            echo "TORRENTA_MAC_SIGN_IDENTITY=$identity"
            echo "TORRENTA_MAC_KEYCHAIN=$kc"
          } >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Package
        run: ./mvnw -B --no-transfer-progress clean -Pdist -DskipTests -Dskip.installers=false package
        shell: bash

      # The same check CI makes on every push: the packaged app must start its engine from the
      # image's own library. A release that fails here never reaches the upload.
      - name: Smoke-test the packaged app
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            macos-*)   launcher="target/dist/Torrenta.app/Contents/MacOS/Torrenta" ;;
            windows-*) launcher="target/dist/Torrenta/Torrenta.exe" ;;
            *)         launcher="target/dist/Torrenta/bin/Torrenta" ;;
          esac
          export TORRENTA_CAPTURE="$RUNNER_TEMP/packaged.png"
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get install -y -qq xvfb
            xvfb-run -a "$launcher" --config-dir "$RUNNER_TEMP/pkgcfg" > "$RUNNER_TEMP/packaged.log" 2>&1 || true
          else
            "$launcher" --config-dir "$RUNNER_TEMP/pkgcfg" > "$RUNNER_TEMP/packaged.log" 2>&1 || true
          fi
          grep -q "capture: engine=libtorrent" "$RUNNER_TEMP/packaged.log" || {
            grep -E '^capture:' "$RUNNER_TEMP/packaged.log" || cat "$RUNNER_TEMP/packaged.log"
            echo "::error::the engine did not start in the packaged app"; exit 1; }
          echo "packaged smoke test: OK"

      # Apple scans the signed dmg and, if it passes, issues a ticket; stapling attaches it so Gatekeeper
      # accepts the dmg offline too. A rejection prints Apple's log, which names each offending file. The
      # checks at the end are what Gatekeeper does on a user's Mac: the dmg and the app inside it must both
      # be accepted as notarized Developer ID code. (The smoke test above already ran this same signed app
      # under the hardened runtime, engine and all.)
      - name: Notarize the dmg (macOS)
        if: steps.macsign.outputs.enabled == 'true'
        shell: bash
        timeout-minutes: 35
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_API_KEY_P8" ] || [ -z "$APPLE_API_KEY_ID" ]; then
            echo "::error title=Notarization secrets missing::APPLE_API_KEY_P8 / APPLE_API_KEY_ID are not set"
            exit 1
          fi
          # Easy to mix up when copying them off the Integrations page: the issuer is a UUID shown above the
          # key list, the key ID is 10 characters in the key's row. Say which one is wrong before Apple does.
          uuid='^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
          if [ -n "$APPLE_API_ISSUER" ] && ! [[ "$APPLE_API_ISSUER" =~ $uuid ]]; then
            echo "::error title=APPLE_API_ISSUER is not an issuer ID::it must be the UUID shown as Issuer ID above the team key list (xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx)"
            exit 1
          fi
          if ! [[ "$APPLE_API_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error title=APPLE_API_KEY_ID is not a key ID::it must be the 10-character Key ID from the key's row"
            exit 1
          fi
          key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$key"
          # A team key needs the issuer; an individual key has none.
          auth=(--key "$key" --key-id "$APPLE_API_KEY_ID")
          [ -n "$APPLE_API_ISSUER" ] && auth+=(--issuer "$APPLE_API_ISSUER")

          dmg="$(ls target/installers/*.dmg | head -1)"
          # The app INSIDE the dmg must still carry our signature, intact: jpackage re-signs an image it
          # believes unsigned, ad hoc, and anything the wrap changes in the bundle breaks the seal. Checking
          # here takes seconds and names the changed file; Apple takes minutes to say only "invalid".
          pre="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$pre" "$dmg" > /dev/null
          if ! codesign -dv --verbose=2 "$pre"/*.app 2>&1 | grep -q '^Authority=Developer ID Application'; then
            codesign -dv --verbose=2 "$pre"/*.app || true
            hdiutil detach "$pre" > /dev/null || true
            echo "::error title=dmg app not Developer ID signed::the app inside $(basename "$dmg") lost its Developer ID signature during the dmg wrap"
            exit 1
          fi
          if ! codesign --verify --deep --strict --verbose=4 "$pre"/*.app; then
            hdiutil detach "$pre" > /dev/null || true
            echo "::error title=dmg app signature broken::the app inside $(basename "$dmg") no longer verifies; the codesign output above names what changed"
            exit 1
          fi
          hdiutil detach "$pre" > /dev/null

          echo "Notarizing $dmg"
          out="$(xcrun notarytool submit "$dmg" "${auth[@]}" --wait --timeout 30m --output-format json)" || true
          echo "$out"
          id="$(printf '%s' "$out" | jq -r '.id // empty')"
          status="$(printf '%s' "$out" | jq -r '.status // empty')"
          if [ -n "$id" ]; then
            xcrun notarytool log "$id" "${auth[@]}" || true
          fi
          rm -f "$key"
          if [ "$status" != "Accepted" ]; then
            echo "::error title=Notarization failed::Apple returned '${status:-no result}' for $(basename "$dmg"); the log above lists the problems"
            exit 1
          fi

          # Stapling fetches the ticket from Apple's CDN and validates it in the same call. That fetch
          # can drop, and the ticket sometimes takes a moment to publish, so retry it.
          for attempt in 1 2 3 4 5; do
            xcrun stapler staple "$dmg" && break
            [ "$attempt" = 5 ] && { echo "::error title=Stapling failed::notarized, but the ticket could not be stapled"; exit 1; }
            sleep 20
          done
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" > /dev/null
          trap 'hdiutil detach "$mnt" > /dev/null 2>&1 || true' EXIT
          app="$(ls -d "$mnt"/*.app | head -1)"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          echo "- ✅ ${{ matrix.target }}: signed, notarized and stapled" >> "$GITHUB_STEP_SUMMARY"

      # jpackage names its output after the version it was given, which on macOS is the bumped
      # placeholder (1.1.0 for a 0.1.0 release) and everywhere else carries no target. Renaming to
      # one scheme is what makes three platforms' downloads legible on a single release page, and
      # it is the scheme jreleaser.yml names file by file.
      - name: Name the installers
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.preflight.outputs.version }}"
          cd target/installers
          shopt -s nullglob
          produced=0
          for file in *; do
            ext="${file##*.}"
            mv -v "$file" "Torrenta-$version-${{ matrix.target }}.$ext"
            produced=$((produced + 1))
          done
          if [ "$produced" = 0 ]; then
            echo "::error::no installer was produced for ${{ matrix.target }}"
            exit 1
          fi
          ls -la

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Torrenta-${{ matrix.target }}
          path: target/installers/*
          retention-days: 14
          if-no-files-found: error

      # The runner is ephemeral, but the keychain holds the private key, so remove it as soon as we're done.
      - name: Remove signing keychain (macOS)
        if: always() && steps.macsign.outputs.enabled == 'true'
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/torrenta-signing.keychain-db" || true

  release:
    # A tag publishes; a manual run is the dry run of the same step.
    name: ${{ github.ref_type == 'tag' && 'Publish' || 'Publish (dry run)' }}
    runs-on: ubuntu-latest
    needs: [preflight, build]
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # JReleaser talks to the API with its own token and only reads the local history; nothing
      # here pushes with git, so the checkout's token is not left in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Torrenta-*
          path: artifacts
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: out

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      # jreleaser.yml names each file, so a missing one fails the checksum step before anything is
      # created; this only puts the list where the run page shows it.
      - name: List what will be released
        run: ls -la artifacts out

      # Decided here rather than by editing config: with no token the package managers are excluded
      # outright, and the moment PACKAGES_TOKEN exists they are included again with no change to
      # anything. A skipped packager says so in one line; a failed one buries the reason. A dry run
      # keeps them: it renders the cask and the manifests, reading the tap and the winget fork with
      # the workflow's own token, and pushes nothing.
      - name: Decide what JReleaser runs
        id: packagers
        shell: bash
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "args=full-release --dry-run" >> "$GITHUB_OUTPUT"
            echo "Dry run: nothing is published."
          elif [ -n "${PACKAGES_TOKEN:-}" ]; then
            echo "args=full-release" >> "$GITHUB_OUTPUT"
            echo "PACKAGES_TOKEN is set: the Homebrew cask and winget PR will be published."
          else
            echo "args=full-release --exclude-packager brew --exclude-packager winget" >> "$GITHUB_OUTPUT"
            echo "::notice::No PACKAGES_TOKEN — publishing the GitHub release only. No Homebrew cask, no winget pull request."
          fi

      - name: JReleaser
        # The action's v2 is a branch, not a tag: pinned to its head as of 2026-10-22.
        uses: jreleaser/release-action@97b5e2f0e845de2fe1dbbdf451ac6a21233fafff # v2
        with:
          # The JReleaser the action downloads; its default is whatever was published last.
          version: 1.26.0
          arguments: ${{ steps.packagers.outputs.args }}
        env:
          JRELEASER_PROJECT_VERSION: ${{ needs.preflight.outputs.version }}
          # Creates the release in this repository.
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushes to the Homebrew tap and opens the winget pull request. Those live in other
          # repositories, which the default GITHUB_TOKEN cannot write to — a PAT with repo scope.
          # Without it a release excludes both packagers above; a dry run reads with the default.
          JRELEASER_BREW_GITHUB_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          JRELEASER_WINGET_GITHUB_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Upload JReleaser output
        # The trace is the only way to tell a packager that was skipped from one that failed, and
        # the package directory holds the cask and manifests a dry run rendered.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jreleaser-output
          path: |
            out/jreleaser/trace.log
            out/jreleaser/output.properties
            out/jreleaser/release/CHANGELOG.md
            out/jreleaser/package/
          retention-days: 7
          if-no-files-found: ignore
