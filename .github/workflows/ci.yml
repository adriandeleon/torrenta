# Build and test on all three platforms, and prove the window renders on one of them.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  # A newer push supersedes an older one on the same branch.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the others: which platforms are affected is usually
      # the most useful thing about the failure.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Test
        run: ./mvnw -B --no-transfer-progress verify
        shell: bash
        env:
          # glibc fills freed memory with this byte, so a SWIG proxy used after its owner was
          # finalized crashes here and now instead of once in a hundred runs (Linux only; the
          # other allocators ignore it).
          MALLOC_PERTURB_: '165'

      # A native crash kills the fork with no test failure, and surefire names only the class.
      # TestProgress writes a line before and after every test: a start with no end is the test
      # the JVM died in. The fork's crash report goes beside it (-XX:ErrorFile in the pom), and on
      # Linux systemd-coredump keeps the core, whose every thread it can unwind (the crash report
      # shows one frame of a library built without frame pointers).
      - name: Say where a crashed fork died
        if: failure()
        shell: bash
        run: |
          progress=target/surefire-reports/test-progress.log
          if [ -f "$progress" ]; then echo "--- last tests started ---"; tail -n 6 "$progress"; fi
          for report in target/surefire-reports/hs_err_pid*.log hs_err_pid*.log; do
            [ -f "$report" ] || continue
            echo "--- $report ---"; sed -n '1,40p' "$report"
          done
          if [ "$RUNNER_OS" = "Linux" ] && command -v coredumpctl > /dev/null; then
            sudo coredumpctl info --no-pager java || true
          fi

      # A JVM that aborts (SIGABRT) leaves no hs_err and prints nothing; macOS's crash reporter
      # still writes a report with every thread's stack. It goes into the uploaded folder, and the
      # crashed thread is printed here so the log alone names the culprit.
      - name: Keep macOS crash reports
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p target/surefire-reports/crash-reports
          found=0
          for f in ~/Library/Logs/DiagnosticReports/java*.ips /Library/Logs/DiagnosticReports/java*.ips; do
            [ -f "$f" ] || continue
            found=1
            cp "$f" target/surefire-reports/crash-reports/
            python3 -I .github/scripts/ips-summary.py "$f" || head -c 4000 "$f"
          done
          [ "$found" = 1 ] || echo "no java crash report under DiagnosticReports"

      - name: Upload test reports
        # Only the failures matter here, and only then. The fork's crash report is under
        # surefire-reports; one from another JVM would be next to the pom.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-${{ matrix.os }}
          path: |
            target/surefire-reports/
            hs_err_pid*.log
          retention-days: 7

      # Starts the real window under a virtual display and checks it painted and the engine came
      # up inside it. A green test job proves the pure code and that the native loads on the class
      # path; this proves the toolkit, the theme, the window and the engine on the module path.
      - name: Smoke-test the window
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          xvfb-run -a scripts/dev-run.sh "-Dtorrenta.capture=$RUNNER_TEMP/smoke.png" "-Dtorrenta.nativeDir=$RUNNER_TEMP/native" \
            "-Dtorrenta.captureAfterMs=6000" "-Dtorrenta.captureAction=dialog-add" \
            -- --config-dir "$RUNNER_TEMP/config" "magnet:?xt=urn:btih:0123456789abcdef0123456789abcdef01234567&dn=Smoke%20test" > "$RUNNER_TEMP/smoke.log" 2>&1 || true
          grep -E '^capture:' "$RUNNER_TEMP/smoke.log" || cat "$RUNNER_TEMP/smoke.log"
          [ -s "$RUNNER_TEMP/smoke.png" ] || { echo "::error::no screenshot — the window never rendered"; exit 1; }
          grep -q "capture: title=Torrenta" "$RUNNER_TEMP/smoke.log" || { echo "::error::the window did not report its title"; exit 1; }
          grep -q "capture: engine=libtorrent" "$RUNNER_TEMP/smoke.log" || { echo "::error::the engine did not start inside the app"; exit 1; }
          grep -q "capture: event=Info Added Smoke test" "$RUNNER_TEMP/smoke.log" || { echo "::error::the Add dialog did not add the magnet"; exit 1; }
          ls "$RUNNER_TEMP/config/torrents/"*.fastresume > /dev/null || { echo "::error::no resume data was written for the added magnet"; exit 1; }
          echo "smoke test: the window rendered, the engine started, the magnet was stored"

      - name: Upload smoke screenshot
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshot
          path: ${{ runner.temp }}/smoke.png
          retention-days: 7

  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # jlink and jpackage are host-specific: there is no cross-building, so each platform's image
      # can only be produced by that platform. This is the step that says whether a release could
      # be cut today, which is why it runs on every push rather than only on a tag.
      - name: Installer prerequisites
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fakeroot rpm binutils

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          # Linux builds the installers too, because that is where their contents get checked. The
          # other platforms only need to prove the app image builds.
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            ./mvnw -B --no-transfer-progress clean -Pdist -DskipTests -Dskip.installers=false package
          else
            ./mvnw -B --no-transfer-progress clean -Pdist -DskipTests package
          fi

      - name: Check the image exists and carries the engine
        shell: bash
        run: |
          set -euo pipefail
          [ -d target/dist ] || { echo "::error::no app image was produced"; exit 1; }
          du -sh target/dist/* || true
          native=$(find target/dist -name 'libtorrent4j.*' -type f | head -1)
          [ -n "$native" ] || { echo "::error::the engine's native library is not in the image"; exit 1; }
          echo "native: $native"

      # Launches the packaged application and checks the engine came up inside it: the JVM, JavaFX,
      # the linked image and the native library found at the path the launcher hands over. The
      # unit tests prove the native loads from a jar on the class path; only this proves the image.
      - name: Smoke-test the packaged app
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.os }}" in
            macos-*)   launcher="target/dist/Torrenta.app/Contents/MacOS/Torrenta" ;;
            windows-*) launcher="target/dist/Torrenta/Torrenta.exe" ;;
            *)         launcher="target/dist/Torrenta/bin/Torrenta" ;;
          esac
          [ -x "$launcher" ] || { echo "::error::no launcher at $launcher"; exit 1; }
          export TORRENTA_CAPTURE="$RUNNER_TEMP/packaged.png"
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
            xvfb-run -a "$launcher" --config-dir "$RUNNER_TEMP/pkgcfg" > "$RUNNER_TEMP/packaged.log" 2>&1 || true
          else
            "$launcher" --config-dir "$RUNNER_TEMP/pkgcfg" > "$RUNNER_TEMP/packaged.log" 2>&1 || true
          fi
          grep -E '^capture:' "$RUNNER_TEMP/packaged.log" | grep -v 'Listening on' || cat "$RUNNER_TEMP/packaged.log"
          [ -s "$RUNNER_TEMP/packaged.png" ] || { echo "::error::no screenshot — the packaged window never rendered"; exit 1; }
          grep -q "capture: engine=libtorrent" "$RUNNER_TEMP/packaged.log" || { echo "::error::the engine did not start in the packaged app"; exit 1; }
          [ ! -d "$RUNNER_TEMP/pkgcfg/native" ] || { echo "::error::the packaged app unpacked a native instead of using the image's"; exit 1; }
          echo "packaged smoke test: the engine started from the image's own library"

      - name: Upload packaged screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-${{ matrix.os }}
          path: ${{ runner.temp }}/packaged.png
          retention-days: 7
          if-no-files-found: ignore

      # The Linux packages carry a desktop entry that jpackage will replace with its own if the
      # override is not named exactly after the launcher; asserted against a real package.
      - name: Check the Linux package contents
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq desktop-file-utils
          deb=$(ls target/installers/*.deb)
          echo "inspecting $deb"
          dpkg-deb --contents "$deb" > "$RUNNER_TEMP/deb-contents.txt"
          grep -q "torrenta-native/libtorrent4j.so" "$RUNNER_TEMP/deb-contents.txt" || {
            echo "::error::the package has no engine library"; exit 1; }
          rm -rf "$RUNNER_TEMP/deb" && mkdir -p "$RUNNER_TEMP/deb"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/deb"
          entry=$(find "$RUNNER_TEMP/deb" -type f -name "*.desktop" -print -quit)
          [ -n "$entry" ] || { echo "::error::the package installs no desktop entry"; exit 1; }
          echo "--- shipped desktop entry ---"; cat "$entry"
          desktop-file-validate "$entry"
          grep -q "^StartupWMClass=com.torrenta.App$" "$entry" || {
            echo "::error::no StartupWMClass — the override was ignored, as it is when misnamed"; exit 1; }
          grep -q "^Categories=.*P2P" "$entry" || { echo "::error::not registered as a P2P application"; exit 1; }
          grep -q "^MimeType=application/x-bittorrent;x-scheme-handler/magnet;$" "$entry" || {
            echo "::error::the entry does not declare .torrent files and magnet links"; exit 1; }
          grep -q "^Exec=.* %U$" "$entry" || { echo "::error::Exec takes no files or links (%U)"; exit 1; }
          grep -q "MimeInfo.xml" "$RUNNER_TEMP/deb-contents.txt" || {
            echo "::error::the package carries no MIME XML for .torrent (jpackage --file-associations)"; exit 1; }
          if grep -q "APPLICATION_" "$entry"; then
            echo "::error::an APPLICATION_* placeholder was not substituted"; exit 1
          fi
          ls target/installers/
          echo "package contents: OK"
