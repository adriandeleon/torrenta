# The .torrent file association jpackage writes into the Windows installer's registry entries and
# as a shared-mime XML into the Linux packages (scripts/build-installers.sh; jpackage takes the
# option for installer types only). The desktop entry lists the type by hand (see
# packaging/linux/NOTES.md) and the macOS bundle gets it from scripts/add-mac-types.sh, which
# declares the magnet: scheme too; on Windows the scheme is the registry's, from Settings.
extension=torrent
mime-type=application/x-bittorrent
description=BitTorrent file
