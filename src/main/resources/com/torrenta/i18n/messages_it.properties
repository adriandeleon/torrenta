settings.general.extendedWindow=Unire la barra dei menu alla barra del titolo
settings.general.extendedWindow.desc=Sperimentale. Disegna la finestra senza la barra del titolo di sistema e mette i menu, il titolo e i pulsanti della finestra su quell'unica riga. Non su macOS, dove il menu appartiene alla barra di sistema. Si applica dopo un riavvio di Torrenta.
settings.general.extendedWindow.keywords=title bar titlebar menu bar menubar header extended window chrome decorations csd compact row space barra titolo menu finestra
settings.general.paletteKey=Riquadro comandi
settings.general.paletteKey.desc=La combinazione che apre il riquadro: Alt+X, la M-x di Editora, oppure Ctrl+Shift+P delle prime versioni. Il menu Visualizza e la barra degli strumenti mostrano quella in vigore. Applicato subito.
settings.general.paletteKey.keywords=keyboard shortcut chord key binding keybinding palette command alt x m-x ctrl shift p tastiera scorciatoia combinazione tasto riquadro comandi
settings.general.trayIcon=Mostra un'icona nell'area di notifica
settings.general.trayIcon.desc=La freccia nel pannello: verde acqua mentre qualcosa è in download, rossa quando un torrent ha un errore. Il suo suggerimento e il suo menu riportano le velocità. Dove il desktop ha un'area di notifica: KDE, GNOME con l'estensione AppIndicator, Windows e la barra dei menu di macOS; su Windows e macOS si applica dopo il riavvio di Torrenta.
settings.general.trayIcon.keywords=tray icon panel notification area menu bar status item indicator appindicator dock icona pannello area di notifica barra dei menu indicatore
settings.general.closeToTray=Chiudendo la finestra Torrenta resta nell'area di notifica
settings.general.closeToTray.desc=I torrent continuano; Mostra Torrenta nell'icona dell'area di notifica riporta la finestra, il suo Esci termina il programma, come Esci nel menu File. Senza area di notifica, chiudere equivale a uscire.
settings.general.closeToTray.keywords=close to tray hide minimize minimise background keep running quit exit window chiudi nascondi riduci sfondo esci finestra area di notifica
settings.general.osHandler=Registra come gestore dei file .torrent e dei link magnet
settings.general.osHandler.desc=Un .torrent aperto con doppio clic e un link magnet nel browser si aprono qui, nel Torrenta in esecuzione se c'è. Su Linux imposta il predefinito del desktop con xdg-mime a ogni avvio di Torrenta; su Windows scrive il protocollo magnet: e il predefinito per .torrent nella chiave di registro di questo utente, e togliere la spunta li rimuove; su macOS il bundle dell'app dichiara entrambi e sceglie Finder con Ottieni informazioni → Apri con, quindi questa casella si limita a spiegare. La barra di stato dice cosa è successo.
settings.general.osHandler.keywords=handler default application open with torrent magnet protocol scheme mime xdg-mime registry file association single instance gestore applicazione predefinita apri con protocollo registro associazione file
settings.general.osBadge=Mostra l'attività di download sull'icona del Dock
settings.general.osBadge.desc=Il badge del Dock di macOS mostra la velocità di download mentre qualcosa è in download; un launcher Linux che rispetta il badge di Unity (KDE, Dash to Dock) mostra quanti torrent sono in download. Si azzera quando nessuno lo è. Niente su Windows, la cui barra delle applicazioni mette badge solo sul tipo di finestra che Torrenta non è. Su macOS si applica dopo il riavvio di Torrenta.
settings.general.osBadge.keywords=badge dock taskbar launcher count rate download activity unity overlay barra delle applicazioni conteggio velocità attività
settings.general.downloadDir=Cartella dei download
settings.general.downloadDir.desc=Dove i nuovi torrent salvano i file; la finestra Aggiungi parte da qui e può sceglierne un'altra.
settings.general.downloadDir.keywords=save path directory location percorso salvataggio cartella posizione
settings.general.incompleteDir=Cartella dei download incompleti
settings.general.incompleteDir.desc=I download iniziano qui e al completamento vengono spostati nel loro percorso di salvataggio; un file già presente non viene mai sovrascritto. Questa cartella è di questa macchina e non si sincronizza.
settings.general.incompleteDir.keywords=temporary partial in progress move finished temporanea parziale in corso sposta completati incompleti
settings.general.partSuffix=Aggiungi .part ai file incompleti
settings.general.partSuffix.desc=Ogni file porta il suffisso finché non è completo, così un file scaricato a metà non viene mai scambiato per uno intero. Vale per i torrent aggiunti da ora in avanti.
settings.general.partSuffix.keywords=suffix extension !qB !tr partial rename suffisso estensione parziale rinomina
settings.general.preallocate=Prealloca spazio su disco per tutti i file
settings.general.preallocate.desc=Un file viene scritto alla sua dimensione completa fin dalla prima parte, il che lo tiene contiguo sul disco e fallisce subito se il disco è pieno. Vale per i torrent aggiunti da ora in avanti.
settings.general.preallocate.keywords=allocate sparse fragmentation full size prealloca allocazione frammentazione dimensione completa
settings.general.updateCheck=Controlla aggiornamenti
settings.general.updateCheck.desc=Chiede a GitHub una versione più recente dopo l'avvio, al massimo una volta al giorno. Aiuto → Controlla aggiornamenti chiede comunque.
settings.general.updateCheck.keywords=release version github automatic versione aggiornamento automatico
