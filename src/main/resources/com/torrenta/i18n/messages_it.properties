settings.general.language.keywords=language locale idioma langue sprache lingua interface translation english deutsch español français italiano português interfaccia traduzione
settings.general.debugLog=Registro di debug
settings.general.debugLog.desc=Avvisi, errori e crash di questa sessione, scritti anche in {0} accanto alle impostazioni. Copialo in una segnalazione di bug.
settings.general.debugLog.keywords=debug log diagnostics errors warnings crash trace troubleshoot bug report session file registro diagnostica errori avvisi segnalazione sessione
