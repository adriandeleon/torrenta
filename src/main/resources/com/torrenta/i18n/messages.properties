settings.general.trayIcon.desc=The arrow in the panel: teal while something downloads, red when a torrent has an error. Its tooltip and menu carry the rates. Where the desktop has a tray: KDE, GNOME with the AppIndicator extension, Windows and the macOS menu bar; on Windows and macOS it applies after restarting Torrenta.
settings.general.trayIcon.keywords=tray icon panel notification area menu bar status item indicator appindicator dock
settings.general.closeToTray=Closing the window keeps Torrenta in the tray
settings.general.closeToTray.desc=The torrents go on; the tray icon's Show Torrenta brings the window back, its Quit ends the program, as does Quit in the File menu. Without a tray, closing quits.
settings.general.closeToTray.keywords=close to tray hide minimize minimise background keep running quit exit window
settings.general.osHandler=Register as handler for .torrent files and magnet links
settings.general.osHandler.desc=A double-clicked .torrent and a magnet link in the browser open here, in the running Torrenta when there is one. On Linux this sets the desktop's default with xdg-mime each time Torrenta starts; on Windows it writes the magnet: protocol and the .torrent default under this user's registry key, and unticking removes them; on macOS the app bundle declares both and Finder's Get Info → Open with chooses, so this box only explains. The status bar says what happened.
settings.general.osHandler.keywords=handler default application open with torrent magnet protocol scheme mime xdg-mime registry file association single instance
settings.general.osBadge=Show download activity on the dock icon
settings.general.osBadge.desc=The macOS dock badge shows the download rate while something downloads; a Linux launcher that honours Unity's badge (KDE, Dash to Dock) shows how many torrents are downloading. Cleared when nothing does. Nothing on Windows, whose taskbar badges only the kind of window Torrenta is not. On macOS it applies after restarting Torrenta.
