settings.general.theme=Thème
settings.general.theme.desc=La paire Caret & Ink d'Editora, et Nord et Cupertino d'AtlantaFX, en clair et en sombre. Appliqué immédiatement.
settings.general.theme.keywords=appearance colors colours dark light nord cupertino editora style apparence couleurs sombre clair thème
settings.general.density=Densité des lignes
settings.general.density.desc=Les lignes confortables tiennent sur deux lignes : le nom au-dessus d'une fine barre de progression, et ce que fait le torrent. Les lignes compactes tiennent sur une seule, avec Progression et État en colonnes. Chaque densité garde ses propres colonnes.
settings.general.density.keywords=rows density comfortable compact height two lines list table columns lignes densité confortable compacte hauteur liste tableau colonnes
settings.general.sidebarPlace=Barre latérale
settings.general.sidebarPlace.desc=Les filtres par état, catégorie, étiquette et tracker, à gauche ou à droite de la liste, ou masqués. Affichage → Barre latérale la masque et l’affiche en gardant le côté.
settings.general.sidebarPlace.keywords=sidebar side left right hidden filters layout panel position barre latérale côté gauche droite masquée filtres disposition
settings.general.detailPlace=Panneau de détails
settings.general.detailPlace.desc=Les onglets Général, Fichiers, Pairs et Trackers du torrent sélectionné, sous la liste, à sa droite ou replié. Chaque position garde sa propre taille.
settings.general.detailPlace.keywords=details pane detail bottom right collapse hide layout panel position split panneau détails bas droite replier masquer disposition
settings.general.stateColors=Colorer les lignes selon l'état
settings.general.stateColors.desc=Téléchargement en sarcelle, partage en pervenche, bloqué en ambre, erreurs en rouge : le symbole, le début de l'état et la barre de progression. Désactivé, les symboles et les phrases le disent toujours.
settings.general.stateColors.keywords=state status colours colors glyph progress bar stalled seeding downloading error accessibility état couleurs symbole barre progression bloqué partage téléchargement erreur accessibilité
settings.general.extendedWindow=Fusionner la barre de menus avec la barre de titre
settings.general.extendedWindow.desc=Expérimental. Dessine la fenêtre sans barre de titre système et place les menus, le titre et les boutons de la fenêtre sur cette seule ligne. Pas sur macOS, où le menu appartient à la barre système. S'applique après un redémarrage de Torrenta.
settings.general.extendedWindow.keywords=title bar titlebar menu bar menubar header extended window chrome decorations csd compact row space barre titre menus fenêtre
settings.general.paletteKey=Palette de commandes
settings.general.paletteKey.desc=Le raccourci qui ouvre la palette : Alt+X, le M-x d'Editora, ou le Ctrl+Shift+P des premières versions. Le menu Affichage et la barre d'outils indiquent celui en vigueur. Appliqué immédiatement.
settings.general.paletteKey.keywords=keyboard shortcut chord key binding keybinding palette command alt x m-x ctrl shift p clavier raccourci touche palette commande
settings.general.trayIcon=Afficher une icône dans la zone de notification
settings.general.trayIcon.desc=La flèche dans le panneau : sarcelle pendant un téléchargement, rouge quand un torrent est en erreur. Son infobulle et son menu indiquent les vitesses. Là où le bureau a une zone de notification : KDE, GNOME avec l'extension AppIndicator, Windows et la barre de menus de macOS ; sous Windows et macOS, s'applique après le redémarrage de Torrenta.
settings.general.trayIcon.keywords=tray icon panel notification area menu bar status item indicator appindicator dock icône zone de notification panneau barre de menus indicateur
settings.general.closeToTray=Fermer la fenêtre garde Torrenta dans la zone de notification
settings.general.closeToTray.desc=Les torrents continuent ; Afficher Torrenta dans le menu de l'icône ramène la fenêtre, son Quitter arrête le programme, comme Quitter dans le menu Fichier. Sans zone de notification, fermer quitte.
settings.general.closeToTray.keywords=close to tray hide minimize minimise background keep running quit exit window fermer masquer réduire arrière plan quitter fenêtre
settings.general.osHandler=S'enregistrer comme gestionnaire des fichiers .torrent et des liens magnet
settings.general.osHandler.desc=Un .torrent double-cliqué et un lien magnet dans le navigateur s'ouvrent ici, dans le Torrenta déjà lancé s'il y en a un. Sous Linux, le choix par défaut du bureau est réglé avec xdg-mime à chaque démarrage de Torrenta ; sous Windows, le protocole magnet: et l'association .torrent sont écrits sous la clé de registre de cet utilisateur, et décocher les retire ; sous macOS, le bundle de l'application déclare les deux et Lire les informations → Ouvrir avec du Finder choisit, cette case ne fait donc qu'expliquer. La barre d'état dit ce qui s'est passé.
settings.general.osHandler.keywords=handler default application open with torrent magnet protocol scheme mime xdg-mime registry file association single instance gestionnaire application par défaut ouvrir avec protocole registre association fichiers instance unique
settings.general.osBadge=Afficher l'activité de téléchargement sur l'icône du Dock
settings.general.osBadge.desc=Le badge du Dock de macOS affiche la vitesse de téléchargement pendant un téléchargement ; un lanceur Linux qui honore le badge d'Unity (KDE, Dash to Dock) affiche le nombre de torrents en téléchargement. Effacé quand rien ne télécharge. Rien sous Windows, dont la barre des tâches ne badge que le type de fenêtre que Torrenta n'est pas. Sous macOS, s'applique après le redémarrage de Torrenta.
settings.general.osBadge.keywords=badge dock taskbar launcher count rate download activity unity overlay barre des tâches lanceur compteur vitesse activité téléchargement
settings.general.downloadDir=Dossier de téléchargement
settings.general.downloadDir.desc=Où les nouveaux torrents enregistrent leurs fichiers ; la boîte Ajouter part de là et peut en choisir un autre.
settings.general.downloadDir.keywords=save path directory location chemin de sauvegarde dossier répertoire emplacement
settings.general.incompleteDir=Dossier des téléchargements incomplets
settings.general.incompleteDir.desc=Les téléchargements commencent ici et sont déplacés vers leur chemin de sauvegarde une fois terminés ; un fichier déjà présent n'est jamais écrasé. Ce dossier appartient à cette machine et ne se synchronise pas.
settings.general.incompleteDir.keywords=temporary partial in progress move finished temporaire partiel en cours déplacer terminé incomplet
settings.general.partSuffix=Ajouter .part aux fichiers incomplets
settings.general.partSuffix.desc=Chaque fichier porte le suffixe jusqu'à être complet, ainsi un fichier à moitié téléchargé n'est jamais pris pour un fichier entier. S'applique aux torrents ajoutés à partir de maintenant.
settings.general.partSuffix.keywords=suffix extension !qB !tr partial rename suffixe partiel renommer
settings.general.preallocate=Préallouer l'espace disque pour tous les fichiers
settings.general.preallocate.desc=Un fichier est écrit à sa taille complète dès son premier morceau, ce qui le garde d'un seul tenant sur le disque et échoue tôt quand le disque est plein. S'applique aux torrents ajoutés à partir de maintenant.
settings.general.preallocate.keywords=allocate sparse fragmentation full size allouer préallouer taille complète espace disque
settings.general.updateCheck=Rechercher des mises à jour
settings.general.updateCheck.desc=Demande à GitHub une version plus récente après le démarrage, au plus une fois par jour. Aide → Rechercher des mises à jour demande dans tous les cas.
settings.general.updateCheck.keywords=release version github automatic mise à jour automatique
