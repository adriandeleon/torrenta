settings.general.osBadge=Mostrar a atividade de download no ícone do Dock
settings.general.osBadge.desc=O emblema do Dock do macOS mostra a velocidade de download enquanto algo baixa; um lançador Linux que respeita o emblema do Unity (KDE, Dash to Dock) mostra quantos torrents estão baixando. Limpo quando nada baixa. Nada no Windows, cuja barra de tarefas só marca o tipo de janela que o Torrenta não é. No macOS aplica-se após reiniciar o Torrenta.
settings.general.osBadge.keywords=badge dock taskbar launcher count rate download activity unity overlay emblema dock barra tarefas lançador contagem velocidade download atividade
settings.general.downloadDir=Pasta de downloads
