settings.general.partSuffix=Acrescentar .part aos arquivos incompletos
settings.general.partSuffix.desc=Cada arquivo leva o sufixo até estar completo, para que um arquivo baixado pela metade nunca seja confundido com um inteiro. Vale para os torrents adicionados de agora em diante.
