settings.general.osHandler=Registrar como manipulador de arquivos .torrent e links magnet
settings.general.osHandler.desc=Um .torrent clicado duas vezes e um link magnet no navegador abrem aqui, no Torrenta já em execução quando houver um. No Linux define o padrão do desktop com xdg-mime a cada início do Torrenta; no Windows grava o protocolo magnet: e o padrão de .torrent na chave de registro deste usuário, e desmarcar os remove; no macOS o pacote do aplicativo declara ambos e Obter informações → Abrir com, no Finder, escolhe, por isso esta caixa apenas explica. A barra de status diz o que aconteceu.
