settings.general.osHandler=Als Programm für .torrent-Dateien und Magnet-Links registrieren
settings.general.osHandler.desc=Eine doppelt angeklickte .torrent-Datei und ein Magnet-Link im Browser öffnen sich hier, im laufenden Torrenta, wenn es eines gibt. Unter Linux setzt das bei jedem Start von Torrenta den Desktop-Standard mit xdg-mime; unter Windows schreibt es das Protokoll magnet: und den .torrent-Standard in den Registrierungsschlüssel dieses Benutzers, Abwählen entfernt sie wieder; unter macOS meldet das App-Bundle beides an und Finders Informationen → Öffnen mit entscheidet, sodass dieses Kästchen nur erklärt. Die Statusleiste sagt, was geschehen ist.
settings.general.osHandler.keywords=handler default application open with torrent magnet protocol scheme mime xdg-mime registry file association single instance standardprogramm öffnen mit dateizuordnung registrierung protokoll
settings.general.osBadge=Download-Aktivität auf dem Dock-Symbol anzeigen
settings.general.osBadge.desc=Das macOS-Dock-Badge zeigt die Downloadrate, während etwas herunterlädt; ein Linux-Starter, der Unitys Badge versteht (KDE, Dash to Dock), zeigt, wie viele Torrents herunterladen. Gelöscht, wenn nichts lädt. Nichts unter Windows, dessen Taskleiste nur die Fensterart mit Badges versieht, die Torrenta nicht ist. Unter macOS wirkt es nach einem Neustart von Torrenta.
settings.general.osBadge.keywords=badge dock taskbar launcher count rate download activity unity overlay taskleiste starter anzahl aktivität
