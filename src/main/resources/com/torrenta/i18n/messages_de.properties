settings.general.closeToTray.desc=Die Torrents laufen weiter; „Torrenta anzeigen“ im Infobereich-Menü holt das Fenster zurück, „Beenden“ dort oder im Menü Datei beendet das Programm. Ohne Infobereich beendet Schließen.
