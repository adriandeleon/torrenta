settings.general.stateColors=Zeilen nach Status einfärben
settings.general.stateColors.desc=Herunterladen türkis, Seeding blauviolett, Hängen bernstein, Fehler rot: das Symbol, der Anfang des Status und der Fortschrittsbalken. Abgeschaltet sagen es Symbole und Sätze weiterhin.
