settings.general.paletteKey.keywords=keyboard shortcut chord key binding keybinding palette command alt x m-x ctrl shift p tastatur tastenkombination kürzel befehl
settings.general.trayIcon=Symbol im Infobereich anzeigen
settings.general.trayIcon.desc=Der Pfeil im Panel: türkis, während etwas herunterlädt, rot, wenn ein Torrent einen Fehler hat. Tooltip und Menü zeigen die Raten. Wo der Desktop einen Infobereich hat: KDE, GNOME mit der AppIndicator-Erweiterung, Windows und die macOS-Menüleiste; unter Windows und macOS wirkt es nach einem Neustart von Torrenta.
settings.general.trayIcon.keywords=tray icon panel notification area menu bar status item indicator appindicator dock infobereich symbol systemleiste benachrichtigungsbereich menüleiste
