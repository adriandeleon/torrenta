settings.general.extendedWindow.desc=Experimentell. Zeichnet das Fenster ohne System-Titelleiste und legt Menüs, Titel und Fensterknöpfe in diese eine Zeile. Nicht auf macOS, wo das Menü zur Systemleiste gehört. Gilt nach einem Neustart von Torrenta.
